groups:
  # Removed: '"calling all students" competition Philippines'.
  #
  # It was circular. "calling all students" is an entry in ACTION_TERMS, which is exactly
  # what `classify_document` uses as evidence that a page is a live call for entries, so
  # searching for the classifier's own signal guaranteed every result would look
  # actionable whatever its subject. It returned two municipal tourism poster contests,
  # both of which became alerts.
  #
  # The remaining phrase queries are safe because they pair the action phrase with a
  # competition word, so the subject is constrained as well as the tense.
  hot:
    cadence_hours: 6
    weight: 5
    freshness: pw
    queries:
      - '"registration now open" hackathon Philippines'
      - '"applications now open" hackathon Philippines'
      - '"register now" "case competition" Philippines'
      - 'ideathon Philippines registration'
      # "innovation challenge Philippines registration" on its own matched any innovation
      # news; it produced three of the eight bad events. Requiring a participation cue
      # asks for a page addressed to entrants rather than to readers.
      - '"innovation challenge" Philippines "how to join" OR "how to register"'
      - '"business case competition" Philippines "call for applications"'
  metro:
    cadence_hours: 12
    weight: 4
    freshness: pm
    queries:
      - 'hackathon Metro Manila registration'
      - 'hackathon Makati OR BGC OR Taguig registration'
      - 'hackathon "Quezon City" OR Pasig registration'
      - '"business case competition" Metro Manila'
      - '"consulting competition" Philippines students'
  categories:
    cadence_hours: 24
    weight: 3
    freshness: pm
    queries:
      - 'startup competition Philippines'
      - 'datathon Philippines registration'
      - 'AI competition Philippines students'
      - 'product building competition Philippines'
      - 'strategy competition Philippines students'
  # Event platforms and aggregators. These replaced the former `social` group, whose
  # site:facebook.com / site:linkedin.com / site:instagram.com queries could only ever
  # return domains that config/domains.yaml blocks from fetching.
  #
  # A `site:` operator narrows the answering engines from about six to three, so these
  # are the first queries to come back empty under throttling. They have to earn that.
  # Removed for not earning it:
  #   site:devpost.com     - DevpostAdapter already reads the same catalogue through its
  #                          API, and does it better: events live on *.devpost.com
  #                          subdomains that this query cannot reach.
  #   site:unstop.com      - India-focused; Philippine entries are rare and usually
  #                          reposts of something already found closer to the source.
  #   site:hackathons.ph   - an operator with no keywords, which several engines answer
  #                          with nothing at all.
  platforms:
    cadence_hours: 12
    weight: 4
    freshness: pm
    queries:
      - 'site:eventbrite.com hackathon Philippines'
      - 'site:lu.ma hackathon Philippines'

