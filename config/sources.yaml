# Each organizer may carry an optional `logo:` — a URL to its mark, shown beside the
# organizer's name at the top of a Discord alert. Without one, Akaton falls back to the
# site's own /favicon.ico, which is usually present and always on the organizer's own
# domain, so nothing here tells a third party what Akaton is looking at. Discord fetches
# the image server-side and simply shows nothing if it 404s, so a wrong guess is free.
organizers:
  - id: dict
    name: Department of Information and Communications Technology
    aliases: [DICT, DICT Philippines]
    domains: [dict.gov.ph]
    category: government
    authority: 90
    enabled: true
  - id: dost
    name: Department of Science and Technology
    aliases: [DOST, DOST Philippines]
    domains: [dost.gov.ph]
    category: government
    authority: 90
    enabled: true
  - id: dti
    name: Department of Trade and Industry
    aliases: [DTI, DTI Philippines]
    domains: [dti.gov.ph]
    category: government
    authority: 90
    enabled: true
  - id: ateneo
    name: Ateneo de Manila University
    aliases: [Ateneo, ADMU]
    domains: [ateneo.edu]
    category: university
    authority: 90
    enabled: true
  - id: up
    name: University of the Philippines
    # "UP Diliman" leads because the first alias becomes the search term, and a query for
    # "UP" on its own matches the preposition far more often than the university.
    aliases: [UP Diliman, UP, University of the Philippines]
    domains: [up.edu.ph]
    category: university
    authority: 90
    enabled: true
  - id: dlsu
    name: De La Salle University
    aliases: [DLSU, De La Salle]
    domains: [dlsu.edu.ph]
    category: university
    authority: 90
    enabled: true
  - id: ust
    name: University of Santo Tomas
    aliases: [UST]
    domains: [ust.edu.ph]
    category: university
    authority: 90
    enabled: true
  - id: mapua
    name: Mapua University
    aliases: [Mapua, Mapúa]
    domains: [mapua.edu.ph]
    category: university
    authority: 90
    enabled: true
  - id: devcon
    name: DEVCON Philippines
    aliases: [DEVCON PH, DEVCON]
    domains: [devcon.ph]
    category: community
    authority: 80
    enabled: true
  # Philippine companies that run their own recurring student competitions. Their sites are
  # .com, so the gov.ph/edu.ph platform rules do not reach them and they would otherwise
  # score 50 and be dropped with LOW_AUTHORITY.
  - id: gcash
    name: GCash
    aliases: [GCash, G-Xchange, Mynt]
    domains: [gcash.com]
    category: company
    authority: 85
    enabled: true
  - id: globe
    name: Globe Telecom
    aliases: [Globe, Globe Telecom]
    domains: [globe.com.ph]
    category: company
    authority: 85
    enabled: true
  - id: maya
    name: Maya Philippines
    aliases: [Maya, PayMaya]
    domains: [maya.ph]
    category: company
    authority: 85
    enabled: true
  - id: unionbank
    name: UnionBank of the Philippines
    aliases: [UnionBank, UBP]
    domains: [unionbankph.com]
    category: company
    authority: 85
    enabled: true
# Event platforms and Philippine aggregators, as domain: authority. The verifier accepts a
# single source only at authority 60 or above, so an unlisted site scores 50 (third_party)
# and is rejected with LOW_AUTHORITY. Add a domain here to admit a trusted listing site.
platforms:
  # Restricted Philippine TLDs: only government agencies and accredited schools may hold
  # them, so any host under them is a credible single source for a local competition.
  # Organizers listed above are matched first and keep their own authority.
  gov.ph: 85
  edu.ph: 80
  hackathons.ph: 70
  unstop.com: 70
  lu.ma: 65
  8layeracademy.com: 65
  aifest.ph: 65
# Expanded once per enabled organizer above. `{alias}` is the organizer's first alias.
#
# These are name-based, not `site:`-based, and that is the point. `site:gcash.com
# "case competition"` was a near-certain zero: GCash announces on Facebook, which is
# exactly where ImaGnation was found. A `site:` operator also narrows the answering
# engine pool from about six to three, so those queries were both the least productive
# and the first to fail under throttling. A name query reaches the announcement wherever
# it was published, and the organizer's authority score still lets its own domain clear
# the verifier's gate when the announcement is there.
query_templates:
  - '"{alias}" hackathon registration Philippines'
  - '"{alias}" "case competition" OR ideathon Philippines'
# 13 organizers x 2 templates is 26 queries. At 24 hours they alone would outweigh the
# whole rotation; at 72 they cost about 9 slots a day and leave room for the hot group.
organizer_cadence_hours: 72
structured_sources:
  devpost:
    enabled: true
    cadence_hours: 24
  kaggle:
    enabled: false
    cadence_hours: 24
  # Reddit through a real Chrome session, ported from uyam's shreddit collector.
  # Akaton's HTTP fetcher cannot read Reddit: a permalink returns a JavaScript shell to a
  # logged-out client and old.reddit redirects to a login. Requires the browser extra
  # (`pip install -e ".[browser]"`), Google Chrome, and a desktop session, because a
  # headed window is both harder to block and the only place a challenge can be solved.
  # Disabled by default: enable it once those are in place.
  reddit:
    enabled: true
    cadence_hours: 12
    max_age_days: 90
    # Headless Chrome is redirected to a js_challenge and blocked; a headed window is
    # not, so this needs a desktop session and opens a visible browser while it runs.
    headless: false
    # Seconds to hold a visible challenge open for a person to solve. Leave at 0 for an
    # unattended monitor: it then rotates proxy and moves on instead of stalling.
    challenge_wait_seconds: 0
    profile_dir: data/.browser-profile
    # r/Philippines is high-volume and almost never carries a competition announcement;
    # the developer and IT subreddits are where they are actually posted and discussed.
    subreddits: [PinoyProgrammer, ITPhilippines, ProgrammerPH]
    terms:
      - hackathon
      - business case
      - case competition
      - competition
      - challenge
      - ideathon
      - datathon
    # Each term costs one search plus up to this many post pages, so the whole run is
    # bounded at subreddits x terms x (1 + max_posts_per_term) page loads.
    max_posts_per_term: 5
  # Facebook groups through a headed Chrome session, same Patchright approach as
  # uyam/shreddit. HTTP fetch of facebook.com stays disabled: a logged-out request
  # is a JavaScript shell. Requires the browser extra, Google Chrome, and one
  # manual login in the persistent profile. Direct connection by default; a proxy
  # after a local login is a common Facebook checkpoint trigger.
  # Disabled by default: enable it once you have logged in.
  facebook:
    enabled: true
    cadence_hours: 6
    max_age_days: 62
    headless: false
    # Seconds to hold a visible login or checkpoint open. Leave at 0 for an
    # unattended monitor: it then skips the run instead of stalling. At 600 a single
    # checkpoint blocked the scheduled run for ten minutes every six hours, with nobody
    # watching to solve it. tools/facebook_login.py raises this to 900 on its own,
    # because there the whole point is that a person is sitting in front of it.
    login_wait_seconds: 0
    # Proxy login is what made Facebook serve an endless captcha. Login and
    # scrape on the local connection; outbound event pages still use proxies.txt.
    use_proxy: false
    profile_dir: data/.facebook-profile
    max_posts: 60
    max_permalinks: 35
    scroll_rounds: 16
    groups:
      - url: https://www.facebook.com/groups/philhacks/
        name: philhacks
        location: Philippines

